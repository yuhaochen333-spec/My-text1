<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paulie | Global Trade Specialist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; cursor: none; }
        .cursor { width: 12px; height: 12px; background: #ffffff; border-radius: 50%; position: fixed; pointer-events: none; z-index: 9999; transition: transform 0.1s ease; animation: breathe 2s infinite ease-in-out; mix-blend-mode: difference; }
        @keyframes breathe { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.5; } }
        /* 移除原有的手机端光标隐藏逻辑，实现全平台统一 */
        .section-min-h { min-height: 90vh; padding: 4rem 4vw; display: flex; flex-direction: column; justify-content: center; }
    </style>
</head>
<body class="bg-white">

    <div class="cursor" id="cursor"></div>

    <nav class="fixed top-0 w-full bg-white/80 backdrop-blur-md z-50 border-b border-gray-100">
        <div class="px-8 h-16 flex items-center justify-between">
            <a href="#hero" class="font-bold text-lg">Paulie.</a>
            <div class="flex gap-6 text-sm text-gray-500">
                <a href="#about" class="hover:text-black transition">Vision</a>
                <a href="#expertise" class="hover:text-black transition">Expertise</a>
                <a href="#projects" class="hover:text-black transition">Projects</a>
            </div>
        </div>
    </nav>

    <main class="w-full">
        <section id="hero" class="section-min-h relative bg-black text-white">
            <div class="absolute inset-0 z-0">
                <img src="https://i.postimg.cc/QdkgZf2z/15-Sequoia-Sunrise.png" class="w-full h-full object-cover opacity-60">
                <div class="absolute inset-0 bg-black/40"></div>
            </div>
            
            <div class="relative z-10">
                <h1 class="text-7xl font-thin tracking-tighter leading-none mb-6">Global Trade.</h1>
                <p class="text-xl text-gray-200 font-light max-w-lg mb-10">I am Paulie, 26. Precision, transparency, and global scaling.</p>
                <a href="#about" class="w-fit px-8 py-3 bg-white text-black rounded-full hover:bg-gray-200 transition">Explore</a>
            </div>
        </section>

        <section id="about" class="py-20 px-[4vw] border-t border-gray-100">
            <h2 class="text-xs tracking-widest text-gray-400 uppercase mb-12">Vision & Gallery</h2>
            <div class="grid grid-cols-2 gap-8 items-start">
                <div>
                    <p class="text-3xl font-light leading-relaxed">以 26 岁之名，深耕外贸数字化。我不仅是贸易的执行者，更是物流架构的优化师。</p>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="aspect-[3/4] bg-gray-100 rounded-2xl overflow-hidden"><img src="https://i.postimg.cc/QdkgZf2z/15-Sequoia-Sunrise.png" class="w-full h-full object-cover"></div>
                    <div class="aspect-[3/4] bg-gray-100 rounded-2xl overflow-hidden"><img src="https://i.postimg.cc/QdkgZf2z/15-Sequoia-Sunrise.png" class="w-full h-full object-cover"></div>
                </div>
            </div>
        </section>

        <section id="expertise" class="section-min-h border-t border-gray-100">
            <h2 class="text-xs tracking-widest text-gray-400 uppercase mb-12">Expertise</h2>
            <div class="grid grid-cols-3 gap-8">
                <div class="p-6 bg-gray-50 rounded-3xl">
                    <h3 class="text-xl font-medium mb-3">Supply Chain</h3>
                    <p class="text-sm text-gray-500">优化物流节点。</p>
                </div>
                <div class="p-6 bg-gray-50 rounded-3xl">
                    <h3 class="text-xl font-medium mb-3">Analytics</h3>
                    <p class="text-sm text-gray-500">深度消费挖掘。</p>
                </div>
                <div class="p-6 bg-gray-50 rounded-3xl">
                    <h3 class="text-xl font-medium mb-3">Negotiation</h3>
                    <p class="text-sm text-gray-500">构建合作格局。</p>
                </div>
            </div>
        </section>

        <footer id="contact" class="py-20 px-[4vw] border-t border-gray-100">
            <h2 class="text-xs tracking-widest text-gray-400 uppercase mb-12">Contact</h2>
            <a href="mailto:paulie@trade.com" class="text-5xl font-thin hover:text-blue-600 transition-colors">paulie@trade.com</a>
        </footer>
    </main>

    <script>
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', (e) => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });
    </script>
</body>
</html>
